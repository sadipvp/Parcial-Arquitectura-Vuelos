services:
  db:
    image: postgres:16
    container_name: vuelos_db
    environment:
      POSTGRES_USER: vuelos
      POSTGRES_PASSWORD: vuelos
      POSTGRES_DB: vuelos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuelos"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: vuelos_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://vuelos:vuelos@db:5432/vuelos
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
